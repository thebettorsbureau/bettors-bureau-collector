name: Collect lines, splits, steam

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Keep schedule alive (GitHub pauses public-repo schedules after 60 idle days)
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/collect.yml/enable || true
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pip install requests
      - run: python bb_collector.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          AN_TOKEN: ${{ secrets.AN_TOKEN }}
          AN_AUTH_HEADER: ${{ secrets.AN_AUTH_HEADER }}
