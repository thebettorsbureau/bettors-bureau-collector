name: Collect lines, splits, steam

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Keep schedule alive (GitHub pauses public-repo schedules after 60 idle days)
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/collect.yml/enable || true
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pip install requests
      - name: Collect every 5 minutes for ~5h40m (GitHub only fires the cron a few times a day)
        run: |
          end=$(( $(date +%s) + 340*60 ))
          while [ $(date +%s) -lt $end ]; do
            start=$(date +%s)
            python bb_collector.py || echo "collector run failed, continuing"
            sleep $(( 300 - ($(date +%s) - start) > 0 ? 300 - ($(date +%s) - start) : 1 ))
          done
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          AN_TOKEN: ${{ secrets.AN_TOKEN }}
          AN_AUTH_HEADER: ${{ secrets.AN_AUTH_HEADER }}
          ENGINE_PAT: ${{ secrets.ENGINE_PAT }}
      - name: Start the next loop
        if: always()
        run: gh workflow run collect.yml --repo ${{ github.repository }} || true
        env:
          GH_TOKEN: ${{ github.token }}
